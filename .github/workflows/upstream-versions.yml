name: Upstream Versions

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git jq

      - name: Check upstream versions
        run: ./scripts/check-upstream-versions.sh --changed-only --fail-on-outdated --fail-on-unknown
